/* Vice City palette: restrained neon, ocean blue and sunset coral */
:root{--bg:#0b1422;--panel:#111f31;--panel2:#172b40;--line:#294052;--text:#edf4f5;--muted:#9aadb9;--gold:#65d5d0;--lime:#f29ab8;--vc-pink:#f08db5;--vc-coral:#ff9b7a;--vc-blue:#65d5d0}
body{background:var(--bg);color:var(--text)}
.topline{background:linear-gradient(90deg,#56cfcf 0%,#8badd1 38%,#ed8fb8 72%,#ff9b7a 100%)}
header{background:rgba(10,20,34,.94);border-color:#263d50}
.brand span{color:var(--vc-pink)}
nav a:hover,nav a.active{color:var(--vc-pink)}
.search{background:#122238;border-color:#29465b;color:var(--text)}
.search:focus{border-color:var(--vc-blue)}
.hero{background:linear-gradient(90deg,rgba(7,16,29,.96) 0%,rgba(8,20,35,.78) 46%,rgba(10,25,40,.2) 100%),linear-gradient(0deg,var(--bg) 0%,transparent 46%),url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2000&q=85') center 48%/cover}
.hero h1 em{color:var(--vc-pink)}
.eyebrow,.kicker,.tile .index,.card .tag,.character .role{color:var(--vc-blue)}
.btn,.map-link{background:var(--vc-pink);border-color:var(--vc-pink);color:#172033}
.btn.ghost{background:rgba(10,20,34,.28);color:var(--text);border-color:#6c8295}
.stats{background:#101e30;border-color:var(--line)}
.stat strong{color:var(--vc-pink)}
.section.dark{background:#0e1a2b;border-color:var(--line)}
.tile,.character{background:linear-gradient(145deg,#172a40,#101d2d);border-color:var(--line)}
.tile:hover{border-color:var(--vc-pink)}
.feature,.card,.county,.region-card,.official-map{background:var(--panel);border-color:var(--line)}
.feature a.more,.card a,.character a,.back{color:var(--vc-pink)}
.pagehead{background:linear-gradient(110deg,#142b42 0%,#101b2d 55%,#0b1422 100%);border-color:var(--line)}
.callout{background:#14253a;border-left-color:var(--vc-pink);color:#b7c8d1}
.map-panel{background:#101e30;border-color:var(--line)}
.map-art{background:radial-gradient(ellipse at 45% 42%,#387b78 0%,#244c59 32%,#172f42 58%,#101a2a 76%)}

.map-label{color:#e8d5df}
.region-card img{filter:saturate(.88)}
.place-chip{background:#14253a;border-color:var(--line);color:#dce9ed}
.empty{border-color:var(--line)}
footer{border-color:var(--line)}

const people=[
{slug:'lucia',name:'Люсия Каминос',role:'Главная героиня',lead:'Люсия выходит на свободу после заключения и намерена самостоятельно распоряжаться своей судьбой.',bio:'Люсия выросла в сложных обстоятельствах. Отец научил её драться ещё в детстве. Попытка обеспечить семью привела её в исправительное учреждение Леониды. После освобождения она хочет получить ту жизнь, о которой мечтала её мать.\n\nЛюсия действует решительно и не собирается ждать, пока обстоятельства изменятся сами. Её отношения с Джейсоном становятся центральной частью истории: вместе они рассчитывают добиться большего, чем поодиночке.'},
{slug:'jason',name:'Джейсон Дюваль',role:'Главный герой',lead:'Бывший военный, который пытается оставить прошлое позади, но снова оказывается в криминальной среде.',bio:'Джейсон вырос среди мошенников и преступников. После службы в армии он оказался в Леонида-Кис и работает на местных наркоторговцев. Его повседневная жизнь связана с рискованными поручениями и людьми, которым нельзя полностью доверять.\n\nЗнакомство с Люсией меняет привычный ход его жизни. Их союз строится на общей цели, но доверие и цена будущих решений остаются важными вопросами.'},
{slug:'cal',name:'Кэл Хэмптон',role:'Второстепенный персонаж',lead:'Друг Джейсона, которому спокойнее наблюдать за событиями со стороны.',bio:'Кэл предпочитает домашний комфорт и собственные занятия опасным приключениям. Среди его привычек — прослушивание переговоров береговой охраны и интерес к интернет-теориям. Через него история показывает повседневную, странную и местами параноидальную сторону Леониды.'},

{slug:'drequan',name:'Дре’Куан Прист',role:'Музыкальный предприниматель',lead:'Человек, который стремится добиться успеха в музыкальной индустрии и развивает собственный лейбл.',bio:'Дре’Куан всегда видел себя скорее предпринимателем, чем уличным гангстером. Он развивает Only Raw Records и работает с дуэтом Real Dimez. Его история связана с музыкальной сценой Вайс-Сити и попыткой превратить локальную известность в большой бизнес.'},

function home(){return `<section class="hero"><div class="hero-inner"><div class="eyebrow">Grand Theft Auto VI · независимая энциклопедия</div><h1>Территория<br><em>Леониды</em></h1><p>Исследуй штат, знакомься с его жителями, изучай транспорт и оружие. Большая русскоязычная база знаний о мире Grand Theft Auto VI.</p><div class="actions"><a class="btn" href="#/map">Исследовать карту</a><a class="btn ghost" href="#/characters">Персонажи</a></div></div></section><div class="wrap"><div class="stats"><div class="stat"><strong>01</strong><span>Штат Леонида</span></div><div class="stat"><strong>02</strong><span>Главных героя</span></div><div class="stat"><strong>08</strong><span>Досье персонажей</span></div><div class="stat"><strong>12</strong><span>Разделов базы</span></div></div></div><section class="section"><div class="wrap"><div class="section-head"><div><div class="kicker">Каталог</div><h2>Исследуй мир</h2></div><p>Выбери направление</p></div><div class="grid">${sections.map((s,i)=>`<a class="tile" href="#/${s[1]}"><div class="index">DATABASE / ${String(i+1).padStart(2,'0')}</div><h3>${s[0]}</h3><p>${s[2]}</p></a>`).join('')}</div></div></section><section class="section dark"><div class="wrap"><div class="section-head"><div><div class="kicker">Редакционные материалы</div><h2>Путеводитель по штату</h2></div><a class="back" href="#/guides">Все руководства ↗</a></div><div class="feature-grid"><div class="feature"><div class="kicker">Большой материал</div><h3>Леонида: география, атмосфера и устройство мира</h3><p>От улиц Вайс-Сити до прибрежных островов и болот. Разбираемся, как устроен мир GTA VI и на что обращать внимание во время исследования.</p><a class="more" href="#/guide/0">Читать материал ↗</a></div><div class="feature"><div class="kicker">Персонажи</div><h3>Джейсон и Люсия</h3><p>Два героя, общее дело и криминальная история, которая связывает их судьбы.</p><a class="more" href="#/characters">Открыть досье ↗</a></div></div></div></section>`}

['Vice City','Город на побережье с высотными зданиями, пляжами, портом и международным аэропортом.','https://www.rockstargames.com/VI/_next/static/media/Vice_City_Postcard_landscape.0v2njmlk2n-qm.jpg?akim=1&imdensity=1&imwidth=3840'],
['Leonida Keys','Цепь тропических островов, соединённых дорогами и мостами; вокруг — открытая вода и небольшие поселения.','https://www.rockstargames.com/VI/_next/static/media/Leonida_Keys_Postcard_landscape.05oezf2h--~ed.jpg?akim=1&imdensity=1&imwidth=3840'],
['Grassrivers','Обширные заболоченные территории с мелкими водными протоками и густой растительностью.','https://www.rockstargames.com/VI/_next/static/media/Grassrivers_Postcard_landscape.15-10i39nhex2.jpg?akim=1&imdensity=1&imwidth=3840'],

['Ambrosia','Промышленный район Леониды, известный сахарным производством и заводом Allied Crystal.','https://www.rockstargames.com/VI/_next/static/media/Ambrosia_Postcard_landscape.0gd~9a41ia-rt.jpg?akim=1&imdensity=1&imwidth=3840'],
['Mount Kalaga National Park','Национальный парк на севере штата: леса, горные участки и природные маршруты.','https://www.rockstargames.com/VI/_next/static/media/Mount_Kalaga_National_Park_Postcard_landscape.0c1cb4ocq16n3.jpg?akim=1&imdensity=1&imwidth=3840']
];const counties=[['Lummox County','Север Леониды; здесь находится Mount Kalaga National Park.'],['Kelly County','Западная и центральная часть штата; район Port Gellhorn.'],['Leonard County','Центрально-восточная часть, рядом с Lake Leonida и Ambrosia.'],['Vice-Dale County','Юго-восток штата, включая Vice City и Vice Beach.'],['Mariana County','Юго-западная часть Леониды, в направлении островов Keys.']];const places=['Vice Beach','Lake Leonida','VCIA — международный аэропорт','Key Lento','Southwind','Draper Island','Capri','Watson Bay','Hamlet','Millport','Grayson','Belville','Waning Sands','Mile Zero Air Station'];return shell('География · Официальный атлас','Карта Леониды','Официальные материалы Rockstar Games, шесть представленных регионов и названия мест, отмеченные на карте штата.',`<div class="map-intro"><div class="official-map"><div class="kicker">Rockstar Games · Official map</div><h2>Полная карта штата Леонида</h2><p>Rockstar выпустила официальную карту Леониды для просмотра и печати. Открой оригинал на сайте разработчика или скачай печатную версию в высоком разрешении.</p><a class="map-link" href="https://www.rockstargames.com/VI/media" target="_blank" rel="noopener">Открыть официальную карту ↗</a><p>На странице Rockstar найди блок «Leonida Map & Cover Art Poster» и выбери «View Options».</p></div><div class="map-info"><div class="kicker">Как читать карту</div><h2>Пять округов, дороги и острова</h2><p>Официальный постер показывает дорожную сеть, водоёмы, населённые пункты и пять округов. Карта пригодна для поиска названий и ориентирования по штату.</p><div class="callout">Изображения ниже — официальные региональные открытки Rockstar с игровыми видами. Они показывают реальные игровые локации, а не фанатские реконструкции.</div></div></div><h2 class="map-subhead">Шесть регионов Леониды</h2><div class="region-grid">${regions.map(r=>`<article class="region-card"><img src="${r[2]}" alt="${r[0]} — официальный игровой вид GTA VI" loading="lazy"><div class="region-copy"><h3>${r[0]}</h3><p>${r[1]}</p></div></article>`).join('')}</div><h2 class="map-subhead">Округа штата</h2><div class="county-grid">${counties.map(c=>`<article class="county"><b>${c[0]}</b><p>${c[1]}</p></article>`).join('')}</div><h2 class="map-subhead">Другие отмеченные места</h2><div class="places-list">${places.map(p=>`<div class="place-chip">${p}</div>`).join('')}</div><p class="map-note">Источник изображений и названий регионов: официальные материалы Rockstar Games. Названия округов и отдельных ориентиров сверены с опубликованной картой Леониды. Не все перечисленные места являются отдельными городами: среди них есть районы, острова, объекты инфраструктуры и природные ориентиры. Проект LEONIDA — независимая фанатская энциклопедия.</p>`)}
function vehiclesPage(){
const catalogUrl='https://www.leonidalogbook.com/vehicles/';
return shell('Транспорт · Полная база Леониды','Транспорт GTA VI','Полная визуальная база транспорта: автомобили, мотоциклы, лодки, самолёты, вертолёты и специальная техника.',`
<section class="fleet-intro">
  <div class="fleet-kicker">LEONIDA DATABASE / VEHICLES</div>
  <div class="fleet-intro-row">
    <div><h2>Весь транспорт Леониды</h2><p>Каталог с поиском по названию, фильтрами по классам, карточками и отдельными страницами моделей.</p></div>
    <div class="fleet-total"><strong>311</strong><span>позиций в каталоге</span></div>
  </div>

</section>
<section class="fleet-catalog-shell">
  <div class="fleet-catalog-head"><div><span class="fleet-kicker">INTERACTIVE CATALOG</span><h2>Каталог моделей</h2><p>Интерактивная база загружается целиком, включая фильтры, изображения и страницы отдельных моделей.</p></div><a href="${catalogUrl}" target="_blank" rel="noopener noreferrer">Открыть отдельно ↗</a></div>
  <div class="fleet-frame-wrap"><iframe class="fleet-frame" src="${catalogUrl}" title="Полный каталог транспорта GTA VI — Leonida Logbook" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen"></iframe></div>
  <div class="fleet-fallback"><span>Если каталог не загрузился внутри страницы, открой его напрямую:</span> <a href="${catalogUrl}" target="_blank" rel="noopener noreferrer">Leonida Logbook — Vehicles ↗</a></div>
</section>
<div class="vehicle-note">Каталог и изображения предоставлены Leonida Logbook и загружаются с его сайта. Это независимый фанатский справочник, а не официальный список Rockstar Games. Названия, которые разработчик пока не подтвердил, обозначены на исходной странице соответствующим образом.</div>
`)
}
function sectionPage(id){if(id==='vehicles')return vehiclesPage();const s=sections.find(x=>x[1]===id);if(!s)return home();let items={
vehicles:[['Автомобили','Легковые модели, спортивные машины, внедорожники и коммерческий транспорт.'],['Мотоциклы','Дорожные и внедорожные двухколёсные модели.'],['Водный транспорт','Лодки и другие суда для побережья и внутренних водоёмов.'],['Воздушный транспорт','Самолёты и вертолёты.']],
weapons:[['Пистолеты','Компактное оружие для ближней и средней дистанции.'],['Пистолеты-пулемёты','Автоматическое оружие с высокой скорострельностью.'],['Дробовики','Оружие ближнего боя с широким разбросом дроби.'],['Винтовки','Оружие для точной стрельбы на средней и дальней дистанции.'],['Тяжёлое оружие','Отдельная категория мощных средств поражения.'],['Модификации','Прицелы, магазины и другие доступные улучшения.']],
locations:[['Вайс-Сити','Городские районы, пляжи, деловые кварталы и жилые зоны.'],['Леонида-Кис','Островные и прибрежные территории.'],['Грассриверс','Болота и природные пространства.'],['Амброзия','Региональные поселения и промышленные территории.']],
story:[['Основная линия','История Джейсона и Люсии и их совместные решения.'],['Сюжетные миссии','Последовательность заданий, цели и важные события.'],['Побочные встречи','Истории жителей и случайные знакомства.']],
activities:[['Исследование','Изучение районов, дорог и удалённых уголков штата.'],['Спорт и отдых','Доступные игровые занятия и развлечения.'],['Случайные события','Непредвиденные встречи в открытом мире.']],
wildlife:[['Прибрежная фауна','Животные побережий и водных пространств.'],['Болотные виды','Животный мир влажных природных территорий.'],['Городская среда','Животные, встречающиеся в населённых районах.']],
radio:[['Радиостанции','Станции и их музыкальные направления.'],['Ведущие','Персонажи, представляющие эфир.'],['Музыкальные подборки','Композиции, подтверждённые в игровом эфире.']],
property:[['Жильё','Дома и другие объекты проживания.'],['Гаражи','Места хранения личного транспорта.'],['Бизнес и объекты','Недвижимость, связанная с деятельностью персонажей.']],
collectibles:[['Коллекционные предметы','Предметы, разбросанные по миру.'],['Исследовательские задачи','Задания, связанные с поиском и изучением местности.'],['Прогресс','Отметки найденного и оставшегося контента.']]
}[id]||[['Обзор раздела',s[2]],['Подробные материалы','Карточки и игровые данные будут дополняться после проверки.']];
return shell('Энциклопедия · Каталог',s[0],s[2],`<div class="toolbar"><input id="filter" placeholder="Найти в разделе..."><span class="count">${items.length} КАТЕГОРИЙ</span></div><div class="cards" id="cards">${items.map((x,i)=>`<article class="card"><div class="tag">КАТЕГОРИЯ / ${String(i+1).padStart(2,'0')}</div><h3>${x[0]}</h3><p>${x[1]}</p><a href="#/guide/${guides.length+i%guides.length}">Открыть справку →</a></article>`).join('')}</div><div class="callout">Редакционный стандарт: не публикуем выдуманные характеристики, цены, координаты, награды и места появления. Проверенные игровые сведения будут отмечаться отдельно.</div>`)}
function guidePage(i){let g=guides[Number(i)]||guides[0];return shell('Библиотека знаний · Руководство',g[0],g[1],`<article class="profile bodycopy"><a class="back" href="#/guides">← Все руководства</a><h2>Обзор темы</h2><p>${g[1]}</p><h2>Практический подход</h2><p>Для подробного справочника важно фиксировать не только итог, но и условия наблюдения: район, время, состояние сюжета, платформу и версию игры. Так читатель сможет повторить проверку и отличить устойчивое правило от случайного события.</p><h2>Что будет в полной статье</h2><p>Пошаговое описание, примеры, связанные объекты, советы по поиску и заметки о возможных ограничениях. Точные числовые данные добавляются только после подтверждения.</p><div class="callout">Материал является редакционной статьёй независимого фанатского проекта. Он не заменяет официальное руководство разработчика.</div></article>`)}
function guidesPage(){return shell('Редакция · Библиотека','Руководства и статьи','Материалы о мире GTA VI, практические подходы к исследованию и справочная информация.',`<div class="cards">${guides.map((g,i)=>`<article class="card"><div class="tag">РУКОВОДСТВО / ${String(i+1).padStart(2,'0')}</div><h3>${g[0]}</h3><p>${g[1]}</p><a href="#/guide/${i}">Читать материал →</a></article>`).join('')}</div>`)}
function searchPage(q){let list=[...sections.map(s=>({title:s[0],desc:s[2],href:'#/'+s[1]})),...people.map(p=>({title:p.name,desc:p.lead,href:'#/person/'+p.slug})),...guides.map((g,i)=>({title:g[0],desc:g[1],href:'#/guide/'+i}))].filter(x=>(x.title+' '+x.desc).toLowerCase().includes(q.toLowerCase()));return shell('Поиск по базе','Результаты поиска','Запрос: «'+esc(q)+'» · найдено: '+list.length,`<div class="cards">${list.map(x=>`<article class="card"><div class="tag">РЕЗУЛЬТАТ</div><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><a href="${x.href}">Открыть →</a></article>`).join('')||'<div class="empty">Ничего не найдено. Попробуй другой запрос.</div>'}</div>`)}
function render(){let [path,param]=decodeURIComponent(location.hash.slice(2)).split('/');if(!path)app.innerHTML=home();else if(path==='characters')app.innerHTML=characters();else if(path==='person'){let p=people.find(x=>x.slug===param);app.innerHTML=p?characterPage(p):home()}else if(path==='map')app.innerHTML=mapPage();else if(path==='guides')app.innerHTML=guidesPage();else if(path==='guide')app.innerHTML=guidePage(param);else if(path==='search')app.innerHTML=searchPage(param||'');else app.innerHTML=sectionPage(path);document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===location.hash))}
window.addEventListener('hashchange',render);render();
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim())location.hash='/search/'+encodeURIComponent(e.target.value.trim())});
document.addEventListener('input',e=>{if(e.target.id==='filter'){let q=e.target.value.toLowerCase();document.querySelectorAll('#cards .card').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'flex':'none')}});

document.addEventListener('click',e=>{const b=e.target.closest('.vehicle-image');if(b){const box=document.getElementById('vehicle-lightbox');const img=document.getElementById('vehicle-lightbox-img');if(box&&img){img.src=b.dataset.full;box.classList.add('open');box.setAttribute('aria-hidden','false')}}if(e.target.closest('.lightbox-close')||e.target.id==='vehicle-lightbox'){const box=document.getElementById('vehicle-lightbox');if(box){box.classList.remove('open');box.setAttribute('aria-hidden','true')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const box=document.getElementById('vehicle-lightbox');if(box){box.classList.remove('open');box.setAttribute('aria-hidden','true')}}});
document.addEventListener('input',e=>{if(e.target.id==='vehicle-filter'){const q=e.target.value.toLowerCase();document.querySelectorAll('#vehicle-grid .vehicle-card').forEach(x=>x.style.display=x.dataset.search.includes(q)?'':'none')}});
</script></body></html>
