<style>
:root{--bg:#0b0d0e;--panel:#141719;--panel2:#1b2022;--line:#2a3032;--text:#f1f0eb;--muted:#9ba3a2;--gold:#d6b56d;--orange:#e87942;--green:#93b8a1;--max:1440px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,Segoe UI,Arial,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}

.menu-btn{display:none;background:none;border:1px solid var(--line);color:white;padding:8px 11px}
.hero{min-height:510px;position:relative;overflow:hidden;background:linear-gradient(90deg,rgba(8,10,11,.96) 0%,rgba(8,10,11,.78) 42%,rgba(8,10,11,.18) 100%),linear-gradient(0deg,var(--bg),transparent 32%),url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=2200&q=85') center 47%/cover}

.hero-inner{max-width:var(--max);margin:auto;padding:95px 28px 70px;position:relative;z-index:1}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:700}.hero h1{font-size:clamp(48px,7vw,92px);line-height:.91;letter-spacing:-4px;margin:20px 0 22px;text-transform:uppercase;max-width:760px}.hero h1 em{font-style:normal;color:var(--gold)}.hero p{max-width:560px;color:#c3c6c1;font-size:16px}.hero-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border:1px solid var(--gold);background:var(--gold);color:#171513;font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;cursor:pointer;transition:.2s}.btn:hover{background:#f0d18c}.btn.secondary{background:transparent;color:var(--text);border-color:#59605e}.btn.secondary:hover{border-color:var(--gold);color:var(--gold)}

.content-layout{display:grid;grid-template-columns: minmax(0,1fr) 300px;gap:30px}.article-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.article-card{padding:19px 20px;background:var(--panel);border:1px solid var(--line);min-height:148px;display:flex;flex-direction:column;transition:.2s}.article-card:hover{border-color:#927b50;background:#191e1f}.article-card .tag{font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold)}.article-card h3{font-size:16px;line-height:1.3;margin:11px 0 8px}.article-card p{font-size:12px;color:var(--muted);margin:0 0 14px}.article-card a{font-size:10px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-top:auto}

footer{border-top:1px solid var(--line);padding:34px 0;color:var(--muted);font-size:11px}.footer-inner{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footer-brand{color:var(--gold);letter-spacing:2px;font-weight:800}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);grid-column:1/-1}
@media(max-width:1050px){.navlinks{display:none}.search{margin-left:auto}.menu-btn{display:block}.navlinks.open{display:flex;position:absolute;top:74px;left:0;right:0;background:#101415;padding:20px 28px;flex-direction:column;align-items:flex-start;border-bottom:1px solid var(--line)}.content-layout{grid-template-columns:1fr}.sidecol{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.sidebox{margin:0}}
@media(max-width:700px){.nav{padding:0 16px;height:65px;gap:12px}.brand{min-width:0}.brand-mark{width:34px;height:34px}.brand-name{font-size:12px}.search{width:auto;flex:1;max-width:190px}.search input{padding:9px 8px 9px 30px;font-size:12px}.menu-btn{padding:7px}.hero{min-height:480px;background-position:58% center}.hero-inner{padding:80px 18px 55px}.hero h1{letter-spacing:-2px}.hero p{font-size:14px}.wrap{padding:0 16px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:17px}.stat strong{font-size:22px}.section{padding:45px 0}.section-head{display:block}.section-head p{margin-top:8px}.category-grid{grid-template-columns:repeat(2,1fr);gap:8px}.category{min-height:140px;padding:16px}.category h3{font-size:15px;margin-top:22px}.article-list{grid-template-columns:1fr}.sidecol{grid-template-columns:1fr}.page-title{padding:38px 0 27px}.toolbar{align-items:flex-start;flex-direction:column}.article-view{padding:35px 18px 65px}}
</style>

 на PS5, а 212 ГБ описывают место под предзагрузку. Обновления до 01.002.002 от 23 ноября, прошивка PS5, вылеты с ошибкой CE-108255-1 и коробка с кодом."}, {"title": "Занятия и мини-игры в GTA 6: чем заняться в Леониде", "url": "https://gta6wikipedia.ru/stati/zanyatiya-i-mini-igry-gta-6/", "desc": "Гонки дронов на 14 площадках, 10 мест для медитации, 397 трюков и 4 видеоигры. Список занятий GTA 6 с числом точек на карте и трофеями. Rockstar объясняет, почему в игре нет дартса и боулинга."}, {"title": "Русский язык в GTA 6: субтитры, интерфейс и озвучка", "url": "https://gta6wikipedia.ru/stati/russkij-yazyk-v-gta-6/", "desc": "В GTA 6 есть русский язык: Rockstar перевела интерфейс и субтитры, озвучка английская. Отзыв «Игромании» о переводе, языки игры и покупка из России через аккаунты Турции и Индии."}, {"title": "Прохождение GTA 6 на 100%: полный список требований", "url": "https://gta6wikipedia.ru/stati/prohozhdenie-gta-6-na-100-procentov/", "desc": "Для 100% в GTA 6 нужны сюжет и 34 пункта чек-листа, от ограблений банков до сканирования машин. Все 35 требований с оценкой времени и советами по порядку."}, {"title": "Первый час в GTA 6: что сделать в начале игры", "url": "https://gta6wikipedia.ru/stati/pervyj-chas-v-gta-6/", "desc": "Первый час в GTA 6: пролог за Люсию, первые миссии Джейсона, лимит наличных $20 000, сканер WAiNK и ручное сохранение перед важными миссиями."}, {"title": "Самые быстрые машины в GTA 6: рейтинг по скорости", "url": "https://gta6wikipedia.ru/stati/samye-bystrye-mashiny-gta-6/", "desc": "Pegassi Vitello ведёт рейтинг машин GTA 6 по оценке скорости в меню игры: 8,2 из 10 по данным Dexerto. Сводная таблица 45 машин по трём источникам."}, {"title": "Быстрое перемещение в GTA 6: как работает и где открыть", "url": "https://gta6wikipedia.ru/stati/bystroe-peremeschenie-v-gta-6/", "desc": "Быстрое перемещение в GTA 6: Paradise Taxi и RydeMe с пропуском поездки за $100, паром до Dalton Island за $50 и поезда с 25 станциями по всей Леониде."}, {"title": "Ограбления в GTA 6: все крупные дела сюжета", "url": "https://gta6wikipedia.ru/stati/ogrableniya-v-gta-6/", "desc": "В сюжете GTA 6 три больших ограбления: банк Sinfrontera, аэропорт VCIA и база береговой охраны. Подготовка, выплаты и налёты на банки в свободной игре."}, {"title": "Самые быстрые мотоциклы в GTA 6: рейтинг по скорости", "url": "https://gta6wikipedia.ru/stati/samye-bystrye-motocikly-gta-6/", "desc": "Самый быстрый мотоцикл GTA 6 по оценке скорости в меню игры: Nagasaki SFB 1000 с 7,1 из 10 по данным meowdb. Список 19 байков с прототипами и оценками."}, {"title": "Сколько длится сюжет GTA 6: главы, миссии и часы", "url": "https://gta6wikipedia.ru/stati/skolko-dlitsya-syuzhet-gta-6/", "desc": "Сюжет GTA 6 занимает около 80 часов: пролог, 5 глав и 141 миссия, из них 119 обязательных. Таблица по главам и сравнение с GTA V и RDR 2."}, {"title": "Телефон в GTA 6: все приложения, что они делают и когда открываются", "url": "https://gta6wikipedia.ru/stati/telefon-i-prilozheniya-v-gta-6/", "desc": "Телефон в GTA 6 достаётся «крестовиной вверх». WAiNK сканирует машины, BuckMe хранит деньги, RydeMe везёт, Scooter Bros пригоняет авто: таблица 14 приложений."}, {"title": "Спортзал в GTA 6: как качаться и не терять форму", "url": "https://gta6wikipedia.ru/stati/trenirovki-v-gta-6/", "desc": "Тренировки в GTA 6 растят шкалы Strength и Cardio. Focus прокачивают тир и медитация. План занятий во дворе Джейсона и почему после них нужны протеин и сон."}, {"title": "Сон в GTA 6 и длина суток: как пропустить время и что это меняет", "url": "https://gta6wikipedia.ru/stati/son-i-dlina-sutok-v-gta-6/", "desc": "Игровые сутки в GTA 6 идут 144 минуты реального времени. Сон в убежище переводит часы на утро, полдень, вечер или ночь и восстанавливает здоровье героя."}, {"title": "Бронежилет и парашют в GTA 6: где купить, цены и как надеть", "url": "https://gta6wikipedia.ru/stati/bronezhilet-i-parashyut-v-gta-6/", "desc": "Бронежилет и парашют в GTA 6 продают оружейные магазины Ammu-Nation: $250 и $300 по данным Dexerto. Порядок включения жилета и раскладка парашюта, условия обоих читов."}, {"title": "Фоторежим в GTA 6: как открыть Photo Studio и настроить кадр", "url": "https://gta6wikipedia.ru/stati/fotorezhim-v-gta-6/", "desc": "Фоторежим GTA 6 называется Photo Studio и открывается из меню паузы. Пять вкладок настроек и 17 фильтров, до пяти источников света, отдельная камера телефона для селфи."}, {"title": "Повтор миссий в GTA 6: как переиграть задание и где остались медали", "url": "https://gta6wikipedia.ru/stati/povtor-missij-i-medali-v-gta-6/", "desc": "Меню повтора миссий в GTA 6 нет, медалей за сюжет тоже. Задание переигрывают через ручное сохранение: схема на 15 слотов и пороги медалей в тирах и гонках."}, {"title": "Испытания в GTA 6: все 80 заданий, условия и награды", "url": "https://gta6wikipedia.ru/stati/ispytaniya-v-gta-6/", "desc": "В GTA 6 80 испытаний в 8 категориях. Условия всех заданий в таблицах, трофей за 50, зачёт 70 из 80 для 100% и читы на транспорт за каждую категорию."}, {"title": "Сложность в GTA 6: есть ли лёгкий режим и какие настройки помогают", "url": "https://gta6wikipedia.ru/stati/slozhnost-v-gta-6/", "desc": "Уровней сложности в GTA 6 нет, но игру облегчают две настройки: Accessible Combat и Reduced Vehicle Damage. Путь в меню, эффект обеих настроек, ограничения читов, советы по управлению."}, {"title": "Убить или пощадить Арнольда в GTA 6: что меняет выбор", "url": "https://gta6wikipedia.ru/stati/ubit-ili-poschadit-arnolda-v-gta-6/", "desc": "В миссии Hey Arnold! Джейсон решает судьбу брокера Арнольда. Убийство ухудшает криминальный профиль, пощада улучшает его. О возвращении Арнольда источники спорят."}, {"title": "Тюнинг в GTA 6: все 14 мастерских и что в них делают", "url": "https://gta6wikipedia.ru/stati/tyuning-v-gta-6/", "desc": "В GTA 6 14 тюнинг-мастерских, и у каждой свой профиль: от маслкаров до чопперов. Мастерские по округам, виды доработок, бонусы Ultimate Edition, 19 точек Pay 'n' Spray."}, {"title": "Вид от первого лица в GTA 6: есть ли он и как включить", "url": "https://gta6wikipedia.ru/stati/vid-ot-pervogo-lica-v-gta-6/", "desc": "Отдельного режима от первого лица в GTA 6 на старте нет. Камера из глаз включается при осмотре стоя, с телефоном за рулём и в прицеле с оптикой: кнопки и ограничения."}, {"title": "Где найти вертолёт и самолёт в GTA 6: все точки, танк и истребитель", "url": "https://gta6wikipedia.ru/stati/vertolety-i-samolety-v-gta-6/", "desc": "Вертолёты в GTA 6 стоят на площадках со значком H, самолёты ждут на аэродромах без охраны. Точки по округам, танк Rhino и истребитель с базы Mile Zero Air Station."}, {"title": "Как переключаться между Джейсоном и Люсией в GTA 6", "url": "https://gta6wikipedia.ru/stati/pereklyuchenie-geroev-v-gta-6/", "desc": "Смена героя в GTA 6 открывается во второй главе в миссии Coffee Break: зажмите стрелку вправо и нажмите R1 или RB. Кнопки PS5 и Xbox, ограничения, задания одного героя, команды напарнику."}, {"title": "Как сохраниться в GTA 6: ручное сохранение, автосейв и слоты", "url": "https://gta6wikipedia.ru/stati/kak-sohranitsya-v-gta-6/", "desc": "Сохранение в GTA 6 делается через меню паузы. У ручных сохранений 15 слотов, у автосейва один. Разбираем запреты на запись и сбои автосохранения."}, {"title": "Дом Джейсона в GTA 6: ремонт, улучшения и занятия", "url": "https://gta6wikipedia.ru/stati/dom-dzhejsona-v-gta-6/", "desc": "Ремонт дома Джейсона в GTA 6: четыре задания с управлением, срок до возвращения Люсии из тюрьмы и все домашние занятия в первом убежище на Ки-Ленто."}, {"title": "Где купить оружие в GTA 6: Ammu-Nation, редкие стволы и цены", "url": "https://gta6wikipedia.ru/stati/gde-kupit-oruzhie-v-gta-6/", "desc": "Оружие в GTA 6 продаёт сеть Ammu-Nation: от гранаты за $140 до реактивного гранатомёта Hauners H-AT за $16 000. Цены по классам, редкие стволы в отдельных магазинах и тайниках."}, {"title": "Инвентарь оружия в GTA 6: сколько стволов носит герой", "url": "https://gta6wikipedia.ru/stati/inventar-oruzhiya-v-gta-6/", "desc": "В GTA 6 Джейсон и Люсия носят два пистолета и два длинных ствола. Объясняем лимит и показываем, где хранить остальное оружие: багажник и шкафчик Ammu-Nation."}, {"title": "Как сменить одежду в GTA 6: гардероб, магазины и образы", "url": "https://gta6wikipedia.ru/stati/kak-smenit-odezhdu-v-gta-6/", "desc": "Одежда в GTA 6: гардероб дома Джейсона хранит до 10 ваших образов, багажник машины до 5. Адреса магазинов и смена образа для ухода от полиции."}, {"title": "Как не потерять деньги в GTA 6: BuckMe и семейные сбережения", "url": "https://gta6wikipedia.ru/stati/kak-sohranit-dengi-v-gta-6/", "desc": "Наличные в GTA 6 пропадают при смерти или аресте, а финал первой главы забирает ещё больше. Гайд по BuckMe и Family Savings с планом на миссию Tourist Trap."}, {"title": "GTA 6 без убийств: нелетальное оружие и мирное прохождение", "url": "https://gta6wikipedia.ru/stati/neletalnoe-prohozhdenie-gta-6/", "desc": "В GTA 6 врага обезвреживают выстрелом в руку или ногу, а копов останавливают выстрелом по шинам. Разбираем ограбления и погони, после которых нет трупов."}, {"title": "Отношения Джейсона и Люсии в GTA 6: как работает система", "url": "https://gta6wikipedia.ru/stati/otnosheniya-dzhejsona-i-lyusii/", "desc": "У отношений Джейсона и Люсии в GTA 6 4 уровня, от Hot Together до Running on Empty. Уровень поднимают внимание и общие дела, портят пропущенные звонки."}, {"title": "Преступный профиль в GTA 6: от профессионала до психопата", "url": "https://gta6wikipedia.ru/stati/prestupnyj-profil-v-gta-6/", "desc": "В GTA 6 пять преступных профилей, от «Профессионала» до «Неисправимого». Объясняем, какие поступки двигают профиль и как он меняет шкалу фокуса."}, {"title": "Скупщики в GTA 6: все 7 точек и что они покупают", "url": "https://gta6wikipedia.ru/stati/skupschiki-v-gta-6/", "desc": "В GTA 6 семь скупщиков: пятеро берут краденое, двое берут машины. Адреса, миссии для открытия и ставки: выбирайте, кому выгоднее сдать добычу."}, {"title": "Топливо в GTA 6: как заправить машину и зарядить электрокар", "url": "https://gta6wikipedia.ru/stati/toplivo-v-gta-6/", "desc": "В GTA 6 машины тратят бензин, а электрокары заряд батареи. Гайд по заправке, проверке уровня топлива и действиям при пустом баке посреди дороги."}, {"title": "Управление в GTA 6 на PS5 и Xbox: раскладка кнопок", "url": "https://gta6wikipedia.ru/stati/upravlenie-gta-6/", "desc": "Управление в GTA 6 на PS5 и Xbox Series X|S: раскладка кнопок для пешего режима и транспорта. Бег теперь включается на L3, а стрельба висит на R2."}, {"title": "Уровень розыска в GTA 6: как работает полиция и как уйти от погони", "url": "https://gta6wikipedia.ru/stati/uroven-rozyska-v-gta-6/", "desc": "В GTA 6 шесть звёзд розыска и система «жара»: после погони полиция ищет вас по внешности и машине. Гайд по сбросу примет и уходу от полиции."}], "Новости": [{"title": "Оценки GTA 6: 99 на Metacritic и OpenCritic, 8 номинаций The Game Awards", "url": "https://gta6wikipedia.ru/stati/ocenki-gta-6/", "desc": "GTA 6 получила 99 баллов на Metacritic и OpenCritic. Игроки ставят 5,7 из 10 на Metacritic и 4,78 из 5 в PlayStation Store. Самая низкая рецензия, номинации The Game Awards 2026 и премии 2027 года."}, {"title": "Дата выхода GTA 6: когда вышла игра и на каких платформах", "url": "https://gta6wikipedia.ru/stati/data-vyhoda-gta-6/", "desc": "GTA 6 вышла 19 ноября 2026 года на PS5 и Xbox Series X|S, на Xbox One она идёт через облако. Время запуска по регионам, предзагрузка, два переноса и статус версии для ПК."}, {"title": "Патчи GTA 6: все обновления, размеры и исправления", "url": "https://gta6wikipedia.ru/stati/patchi-gta-6/", "desc": "Обновления GTA 6 для PS5 и Xbox Series X|S: версии, даты, размеры и исправления патча 01.002.002. После него остались ошибки с погодой и деньгами у Хэмлета, вылеты CE-108255-1."}, {"title": "Продажи GTA 6: 32,5 млн копий до выхода и $3,79 млрд за первый день", "url": "https://gta6wikipedia.ru/stati/prodazhi-gta-6/", "desc": "Take-Two назвала 32,5 млн копий GTA 6 до выхода и $3,79 млрд за первый день, Sony 39 млн игроков на PS5. Коробки в Великобритании и Японии, Sensor Tower, Circana, рекорды и прогнозы."}, {"title": "GTA 6 Online: когда выйдет сетевой режим и что о нём известно", "url": "https://gta6wikipedia.ru/stati/gta-6-online/", "desc": "GTA 6 вышла без онлайна, и даты сетевого режима нет. По данным Bloomberg, его ожидают в 2027 году. Разбираем подтверждённые факты, слухи и шаги Rockstar к ролевым серверам."}, {"title": "В GTA 6 нет микротранзакций и генеративного ИИ: что сказала Rockstar", "url": "https://gta6wikipedia.ru/stati/mikrotranzakcii-i-ii-v-gta-6/", "desc": "Rockstar подтвердила: в сюжетной GTA 6 нет платных покупок за реальные деньги и контента от генеративного ИИ. Разбираем заявления и вопрос про GTA Online."}, {"title": "Трейлеры GTA 6: все официальные ролики и что в них показали", "url": "https://gta6wikipedia.ru/stati/trejlery-gta-6/", "desc": "Rockstar выпустила к релизу GTA 6 три трейлера и 26-минутный показ Extended Look. Даты выхода роликов, музыка в них и главное, что показала студия."}], "Разборы": [{"title": "GTA 6 на ПК: когда выйдет и что известно о версии для компьютеров", "url": "https://gta6wikipedia.ru/stati/gta-6-na-pk/", "desc": "Rockstar не анонсировала GTA 6 на ПК. Слух GamesBeat о 2027 годе, сроки прошлых портов, замеры Digital Foundry, фанатские порты после жалобы DMCA от Take-Two и поддельная страница в Steam."}, {"title": "GTA 6 на PS5, PS5 Pro и Xbox Series: разрешение и кадры", "url": "https://gta6wikipedia.ru/stati/gta-6-na-ps5-pro-i-xbox-series/", "desc": "GTA 6 идёт в 30 кадров на всех консолях, режим 60 кадров Rockstar исключила даже для PS5 Pro. Разрешение и просадки по Digital Foundry, глюк Quick Resume на Xbox Series X и его замеры."}, {"title": "История GTA 6: от утечек и анонса до релиза 19 ноября 2026 года", "url": "https://gta6wikipedia.ru/stati/istoriya-razrabotki-gta-6/", "desc": "Хронология GTA 6 с 2018 года: слухи, взлом Rockstar и приговор хакеру в семь лет, два переноса и релиз 19 ноября 2026 года. Отмечаем, какие утечки подтвердились."}, {"title": "Размер карты GTA 6: сравнение с GTA 5 и RDR 2", "url": "https://gta6wikipedia.ru/stati/razmer-karty-gta-6/", "desc": "Суша Леониды в GTA 6 занимает около 82,7 км² против 49,7 км² у GTA 5. Rockstar называет карту вдвое больше, чем в GTA 5. Сравнение по замерам."}, {"title": "Что нового в GTA 6: главные изменения геймплея по сравнению с GTA 5", "url": "https://gta6wikipedia.ru/stati/chto-novogo-v-gta-6/", "desc": "Четыре ствола вместо арсенала и розыск по показаниям свидетелей. Разбираем по темам, чем GTA 6 отличается от GTA 5 и RDR2: стрельба, полиция, транспорт, мир."}, {"title": "Леонида и Флорида: реальные прототипы мест в GTA 6", "url": "https://gta6wikipedia.ru/stati/leonida-i-florida/", "desc": "Вайс-Сити списан с Майами, Грассриверс с Эверглейдс, Амброзия с Клюистона. Таблица реальных прототипов зданий и регионов Леониды в GTA 6 с пояснениями."}], "Сообщество": [{"title": "Форум", "url": "https://gta6wikipedia.ru/forum/", "desc": "вопросы игроков и ответы"}, {"title": "Хаб сообщества", "url": "https://gta6wikipedia.ru/soobschestvo/", "desc": "форум, Discord и Telegram"}], "Optional": [{"title": "О проекте", "url": "https://gta6wikipedia.ru/o-proekte/", "desc": "откуда факты и как сообщить об ошибке"}, {"title": "Правила форума", "url": "https://gta6wikipedia.ru/pravila/", "desc": ""}, {"title": "Конфиденциальность", "url": "https://gta6wikipedia.ru/konfidencialnost/", "desc": "какие данные собирает сайт"}]}, "total": 97};
const app=document.getElementById('app');
const nav=document.getElementById('navlinks');
const icons={'Карта':'⌖','Прохождение':'▤','Чит-коды':'✳','Статьи':'▧','Персонажи':'♟','Транспорт':'◈','Оружие':'✦','Сюжетные миссии':'▤','Незнакомцы и чудаки':'◇','Локации':'⌖','Недвижимость':'⌂','Радиостанции':'♫','Животные':'♧','Банды':'♜','Занятия':'⚑','Мой прогресс':'✓','Сравнение машин':'⇄','Новости':'◉','Разборы':'⌘','Сообщество':'◎'};
const slug=s=>({'Карта':'karta','Прохождение':'missii','Чит-коды':'chity','Статьи':'stati','Персонажи':'personazhi','Транспорт':'transport','Оружие':'oruzhie','Сюжетные миссии':'missii','Незнакомцы и чудаки':'neznakomcy','Локации':'lokacii','Недвижимость':'nedvizhimost','Радиостанции':'radio','Животные':'zhivotnye','Банды':'bandy','Занятия':'zanyatiya','Мой прогресс':'progress','Сравнение машин':'sravnenie','Новости':'novosti','Разборы':'razbory','Сообщество':'soobschestvo'}[s]||s.toLowerCase().replaceAll(' ','-'));
function allItems(){return Object.entries(DB.sections).flatMap(([section,items])=>items.map(x=>({...x,section})))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(x){return `<article class="article-card"><div class="tag">${esc(x.section)}</div><h3>${esc(x.title)}</h3><p>${esc(x.desc||'Материал энциклопедии GTA 6.')}</p><a href="#/article/${encodeURIComponent(x.title)}">Открыть материал ↗</a></article>`}
function categoryCard(name,i){let n=DB.sections[name]?.length||0;return `<div class="category" data-symbol="${icons[name]||'◈'}" onclick="location.hash='/${slug(name)}'"><div class="num">DATABASE / ${(i+1).toString().padStart(2,'0')}</div><h3>${esc(name)}</h3><p>${n} материалов в разделе</p></div>`}
function home(){let categories=Object.keys(DB.sections).filter(x=>!['Optional','Гайды','Новости','Разборы','Сообщество'].includes(x));let popular=allItems().filter(x=>['Гайды','Новости','Разборы'].includes(x.section)).slice(0,8);return `<section class="hero"><div class="hero-inner"><div class="eyebrow">Grand Theft Auto VI · Russian fan encyclopedia</div><h1>Добро пожаловать<br>в <em>Леониду</em></h1><p>База знаний по GTA 6: транспорт, персонажи, миссии, оружие, карта и подробные руководства. Всё, что нужно для исследования штата.</p><div class="hero-actions"><a class="btn" href="#/transport">Исследовать базу</a><a class="btn secondary" href="#/stati">Читать гайды</a></div></div></section>
<div class="wrap"><div class="stats"><div class="stat"><strong>316</strong><span>Единиц транспорта</span></div><div class="stat"><strong>206</strong><span>Видов оружия</span></div><div class="stat"><strong>1 938</strong><span>Точек на карте</span></div><div class="stat"><strong>${DB.total}</strong><span>Материалов в каталоге</span></div></div></div>
<section class="section"><div class="wrap"><div class="section-head"><div><div class="kicker">Навигация по базе</div><h2>Исследуй Леониду</h2></div><p>Основные разделы энциклопедии</p></div><div class="category-grid">${categories.map(categoryCard).join('')}</div></div></section>
<section class="section" style="background:#101415"><div class="wrap"><div class="section-head"><div><div class="kicker">Knowledge base</div><h2>Материалы и руководства</h2></div><a class="back" href="#/stati">Все статьи →</a></div><div class="content-layout"><div class="article-list">${popular.map(card).join('')}</div><aside class="sidecol"><div class="sidebox"><h3>Быстрый доступ</h3><div class="side-links"><a href="#/karta">→ Интерактивная карта</a><a href="#/chity">→ Чит-коды</a><a href="#/missii">→ Сюжетные миссии</a><a href="#/progress">→ Мой прогресс</a></div></div><div class="sidebox"><h3>О проекте</h3><p>Независимый фанатский справочник. Структура каталога сформирована из предоставленного Markdown-файла.</p></div></aside></div></div></section>`}
function listing(section){let items=DB.sections[section]||[];return `<section class="page-title"><div class="wrap"><div class="kicker">GTA 6 Wiki / Database</div><h1>${esc(section)}</h1><p>${items.length} материалов в разделе. Используй поиск, чтобы быстро найти нужную информацию.</p></div></section><div class="wrap section"><div class="toolbar"><input id="sectionSearch" placeholder="Фильтр по названию и описанию..."><span class="count">${items.length} ЗАПИСЕЙ</span></div><div class="article-list" id="listing">${items.map(x=>card({...x,section})).join('')||'<div class="empty">Материалы этого раздела пока не добавлены.</div>'}</div></div>`}
function article(title){let x=allItems().find(a=>a.title===title);if(!x)return `<div class="article-view"><a class="back" href="#/">← На главную</a><h1>Материал не найден</h1></div>`;return `<article class="article-view"><a class="back" href="#/${slug(x.section)}">← ${esc(x.section)}</a><div class="kicker" style="margin-top:32px">GTA 6 Wiki / Материал</div><h1>${esc(x.title)}</h1><p class="lead">${esc(x.desc||'Материал из каталога GTA 6 Wiki.')}</p><div class="notice">Это карточка материала, сформированная по предоставленному Markdown-каталогу. Полный текст руководства находится на исходной странице.</div><a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Открыть полный материал ↗</a><p style="margin-top:35px;color:var(--muted);font-size:12px">Раздел: ${esc(x.section)}</p></article>`}
function searchPage(q){let found=allItems().filter(x=>(x.title+' '+x.desc+' '+x.section).toLowerCase().includes(q.toLowerCase()));return `<section class="page-title"><div class="wrap"><div class="kicker">Поиск по энциклопедии</div><h1>Результаты поиска</h1><p>Запрос: «${esc(q)}» · найдено: ${found.length}</p></div></section><div class="wrap section"><div class="article-list">${found.map(card).join('')||'<div class="empty">По вашему запросу ничего не найдено.</div>'}</div></div>`}
function render(){let [path,param]=decodeURIComponent(location.hash.slice(2)).split('/');if(!path){app.innerHTML=home()}else if(path==='article'){app.innerHTML=article(param)}else if(path==='search'){app.innerHTML=searchPage(param||'')}else{let sec=Object.keys(DB.sections).find(s=>slug(s)===path);app.innerHTML=sec?listing(sec):`<div class="article-view"><a class="back" href="#/">← На главную</a><h1>Раздел в разработке</h1><p class="lead">Этот раздел предусмотрен структурой проекта. Добавьте материалы, чтобы наполнить его.</p></div>`}
document.querySelectorAll('.navlinks a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===location.hash));
let filter=document.getElementById('sectionSearch');if(filter)filter.addEventListener('input',()=>{let q=filter.value.toLowerCase();let filtered=(DB.sections[Object.keys(DB.sections).find(s=>slug(s)===path)]||[]).filter(x=>(x.title+' '+x.desc).toLowerCase().includes(q));document.getElementById('listing').innerHTML=filtered.map(x=>card({...x,section:Object.keys(DB.sections).find(s=>slug(s)===path)})).join('')||'<div class="empty">Ничего не найдено.</div>'});
}
window.addEventListener('hashchange',render);render();
document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim())location.hash='/search/'+encodeURIComponent(e.target.value.trim())});
document.getElementById('menuBtn').addEventListener('click',()=>nav.classList.toggle('open'));
nav.addEventListener('click',()=>nav.classList.remove('open'));
</script>
</body></html>
