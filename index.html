const people=[
{slug:'lucia',name:'Люсия Каминос',role:'Главная героиня',lead:'Люсия выходит на свободу после заключения и намерена самостоятельно распоряжаться своей судьбой.',bio:'Люсия выросла в сложных обстоятельствах. Отец научил её драться ещё в детстве. Попытка обеспечить семью привела её в исправительное учреждение Леониды. После освобождения она хочет получить ту жизнь, о которой мечтала её мать.\n\nЛюсия действует решительно и не собирается ждать, пока обстоятельства изменятся сами. Её отношения с Джейсоном становятся центральной частью истории: вместе они рассчитывают добиться большего, чем поодиночке.'},
{slug:'jason',name:'Джейсон Дюваль',role:'Главный герой',lead:'Бывший военный, который пытается оставить прошлое позади, но снова оказывается в криминальной среде.',bio:'Джейсон вырос среди мошенников и преступников. После службы в армии он оказался в Леонида-Кис и работает на местных наркоторговцев. Его повседневная жизнь связана с рискованными поручениями и людьми, которым нельзя полностью доверять.\n\nЗнакомство с Люсией меняет привычный ход его жизни. Их союз строится на общей цели, но доверие и цена будущих решений остаются важными вопросами.'},
{slug:'cal',name:'Кэл Хэмптон',role:'Второстепенный персонаж',lead:'Друг Джейсона, которому спокойнее наблюдать за событиями со стороны.',bio:'Кэл предпочитает домашний комфорт и собственные занятия опасным приключениям. Среди его привычек — прослушивание переговоров береговой охраны и интерес к интернет-теориям. Через него история показывает повседневную, странную и местами параноидальную сторону Леониды.'},
{slug:'boobie',name:'Буби Айк',role:'Предприниматель',lead:'Влиятельная фигура Вайс-Сити, соединившая деловые интересы и связи с криминальным миром.',bio:'Буби превратил связи и предпринимательскую хватку в заметную бизнес-империю. Его интересы связаны с недвижимостью, ночной жизнью и музыкальным бизнесом. Он сотрудничает с Дре’Куаном Пристом и лейблом Only Raw Records.'},
{slug:'drequan',name:'Дре’Куан Прист',role:'Музыкальный предприниматель',lead:'Человек, который стремится добиться успеха в музыкальной индустрии и развивает собственный лейбл.',bio:'Дре’Куан всегда видел себя скорее предпринимателем, чем уличным гангстером. Он развивает Only Raw Records и работает с дуэтом Real Dimez. Его история связана с музыкальной сценой Вайс-Сити и попыткой превратить локальную известность в большой бизнес.'},
{slug:'real-dimez',name:'Real Dimez',role:'Музыкальный дуэт',lead:'Бэ-Люкс и Рокси Рашад — подруги со школы, использующие рэп и социальные сети для продвижения.',bio:'Дуэт добился раннего успеха благодаря вирусному треку и узнаваемому образу. Спустя несколько лет девушки подписали контракт с Only Raw Records. Их история показывает, как интернет-культура, музыка и уличная репутация переплетаются в современном Вайс-Сити.'},
{slug:'raul',name:'Рауль Баутиста',role:'Грабитель банков',lead:'Опытный преступник, который ищет людей, готовых рискнуть ради крупной добычи.',bio:'Рауль уверен в собственном опыте и умеет находить возможности для ограблений. Его склонность к риску делает сотрудничество с ним потенциально прибыльным, но опасным. Людям рядом с ним рано или поздно приходится решать, насколько далеко они готовы зайти.'},
{slug:'brian',name:'Брайан Хедер',role:'Контрабандист',lead:'Контрабандист старой школы, работающий через собственную лодочную верфь в Леонида-Кис.',bio:'Брайан продолжает вести дела по старым правилам и предпочитает поручать грязную работу другим. Он связан с местной контрабандой и предоставляет Джейсону жильё в обмен на помощь с делами. Его лодочная верфь — одна из точек пересечения криминальной и повседневной жизни островов.'}

const guides=[
['Как устроена Леонида','Леонида — вымышленный штат на юго-востоке США. В его образе соединены городская культура Флориды, побережье, острова, заболоченные территории и небольшие населённые пункты. Мир следует изучать не только по главным улицам, но и по второстепенным дорогам, водным маршрутам и удалённым районам.'],
['Вайс-Сити: город контрастов','Вайс-Сити — главный городской центр GTA VI. Его образ строится на контрасте туристических пляжей, коммерческих кварталов, жилых районов, портовой инфраструктуры и ночной жизни. При изучении города полезно делить его на отдельные районы и отмечать ориентиры, а не пытаться запомнить всё сразу.'],
['Транспорт: на что обращать внимание','При сравнении машин важны не только максимальная скорость. Для практического справочника следует отдельно оценивать стартовое ускорение, торможение, устойчивость, поведение на неровностях, повреждения и удобство управления. Результаты нужно получать в одинаковых условиях и на одной версии игры.'],
['Оружие: система сравнения','Оружие корректно сравнивать по нескольким параметрам: темп стрельбы, отдача, точность, эффективная дистанция, ёмкость магазина и скорость перезарядки. Модификации следует описывать через их фактическое влияние, а не только по названию.'],
['Как исследовать открытый мир','Для систематического исследования удобно двигаться по районам. Сначала отмечайте дороги, мосты, заправки, магазины и заметные здания. Затем возвращайтесь к побережью, внутренним водным путям и удалённым участкам. Каждую найденную точку стоит сопровождать скриншотом и короткой заметкой.'],
['Как читать сюжетные задания','Описание миссии должно включать место начала, участников, основную цель, этапы, важные решения и последствия. Сюжетные повороты лучше отделять предупреждением о спойлерах. Не следует выдавать предположения о развилках за подтверждённые игровые факты.'],
['Жизнь за пределами сюжета','Открытый мир интересен не только заданиями. Повседневные занятия, музыка, транспорт, животные, городские события и случайные встречи формируют ощущение живого штата. Энциклопедия должна описывать такие элементы отдельно от сюжетной линии.'],
['Как устроена эта энциклопедия','В карточках разделов собраны подтверждённые сведения и редакционные заметки. Там, где точные игровые данные ещё не проверены, мы не публикуем придуманные цифры, координаты, цены и награды. Это позволяет отличать факты от предположений и постепенно расширять базу.']
];
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function shell(kicker,title,desc,content){return `<section class="pagehead"><div class="wrap"><div class="kicker">${kicker}</div><h1>${title}</h1><p>${desc}</p></div></section><section class="wrap content">${content}</section>`}

function characterPage(p){return shell('Досье персонажа · Leonida database',p.name,p.lead,`<div class="profile"><a class="back" href="#/characters">← Все персонажи</a><div class="bodycopy"><h2>Биография</h2><p>${p.bio.replace(/\n\n/g,'</p><p>')}</p><div class="callout">Досье составлено по представленным Rockstar Games описаниям персонажей. Неизвестные детали биографии и сюжетные исходы не додумываются.</div><h2>Роль в истории</h2><p>${p.lead} Подробности участия в заданиях будут добавляться по мере проверки сюжетного материала.</p><h2>Связанные материалы</h2><p><a class="back" href="https://www.rockstargames.com/VI" target="_blank" rel="noopener">Официальная страница GTA VI ↗</a></p></div></div>`)}

n-copy"><h3>${r[0]}</h3><p>${r[1]}</p></div></article>`).join('')}</div><h2 class="map-subhead">Округа штата</h2><div class="county-grid">${counties.map(c=>`<article class="county"><b>${c[0]}</b><p>${c[1]}</p></article>`).join('')}</div><h2 class="map-subhead">Другие отмеченные места</h2><div class="places-list">${places.map(p=>`<div class="place-chip">${p}</div>`).join('')}</div><p class="map-note">Источник изображений и названий регионов: официальные материалы Rockstar Games. Названия округов и отдельных ориентиров сверены с опубликованной картой Леониды. Не все перечисленные места являются отдельными городами: среди них есть районы, острова, объекты инфраструктуры и природные ориентиры. Проект LEONIDA — независимая фанатская энциклопедия.</p>`)}

function guidePage(i){let g=guides[Number(i)]||guides[0];return shell('Библиотека знаний · Руководство',g[0],g[1],`<article class="profile bodycopy"><a class="back" href="#/guides">← Все руководства</a><h2>Обзор темы</h2><p>${g[1]}</p><h2>Практический подход</h2><p>Для подробного справочника важно фиксировать не только итог, но и условия наблюдения: район, время, состояние сюжета, платформу и версию игры. Так читатель сможет повторить проверку и отличить устойчивое правило от случайного события.</p><h2>Что будет в полной статье</h2><p>Пошаговое описание, примеры, связанные объекты, советы по поиску и заметки о возможных ограничениях. Точные числовые данные добавляются только после подтверждения.</p><div class="callout">Материал является редакционной статьёй независимого фанатского проекта. Он не заменяет официальное руководство разработчика.</div></article>`)}

function searchPage(q){let list=[...sections.map(s=>({title:s[0],desc:s[2],href:'#/'+s[1]})),...people.map(p=>({title:p.name,desc:p.lead,href:'#/person/'+p.slug})),...guides.map((g,i)=>({title:g[0],desc:g[1],href:'#/guide/'+i}))].filter(x=>(x.title+' '+x.desc).toLowerCase().includes(q.toLowerCase()));return shell('Поиск по базе','Результаты поиска','Запрос: «'+esc(q)+'» · найдено: '+list.length,`<div class="cards">${list.map(x=>`<article class="card"><div class="tag">РЕЗУЛЬТАТ</div><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><a href="${x.href}">Открыть →</a></article>`).join('')||'<div class="empty">Ничего не найдено. Попробуй другой запрос.</div>'}</div>`)}
function render(){let [path,param]=decodeURIComponent(location.hash.slice(2)).split('/');if(!path)app.innerHTML=home();else if(path==='characters')app.innerHTML=characters();else if(path==='person'){let p=people.find(x=>x.slug===param);app.innerHTML=p?characterPage(p):home()}else if(path==='map')app.innerHTML=mapPage();else if(path==='guides')app.innerHTML=guidesPage();else if(path==='guide')app.innerHTML=guidePage(param);else if(path==='search')app.innerHTML=searchPage(param||'');else app.innerHTML=sectionPage(path);document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===location.hash))}
window.addEventListener('hashchange',render);render();
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim())location.hash='/search/'+encodeURIComponent(e.target.value.trim())});
document.addEventListener('input',e=>{if(e.target.id==='filter'){let q=e.target.value.toLowerCase();document.querySelectorAll('#cards .card').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'flex':'none')}});
